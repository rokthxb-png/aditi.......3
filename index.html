<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ADITI | Official Community</title>

<!-- =========================================================
     META PIXEL
     ========================================================= -->
<script>
!function(f,b,e,v,n,t,s)
{
  if(f.fbq)return;
  n=f.fbq=function(){
    n.callMethod ?
    n.callMethod.apply(n,arguments) :
    n.queue.push(arguments)
  };

  if(!f._fbq)f._fbq=n;

  n.push=n;
  n.loaded=!0;
  n.version='2.0';
  n.queue=[];

  t=b.createElement(e);
  t.async=!0;
  t.src=v;

  s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)
}
(window, document, 'script',
'https://connect.facebook.net/en_US/fbevents.js');

/* Your Meta Pixel ID */
fbq('init', '1055443840541747');

/* PageView - ONLY ONCE */
fbq('track', 'PageView');
</script>

<noscript>
<img
  height="1"
  width="1"
  style="display:none"
  src="https://www.facebook.com/tr?id=1055443840541747&ev=PageView&noscript=1"
/>
</noscript>

<!-- =========================================================
     STYLE
     ========================================================= -->
<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  width: 100%;
  min-height: 100%;
  background: #05050a;
}

body {
  width: 100%;
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(107, 74, 255, 0.20),
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(0, 153, 255, 0.18),
      transparent 35%
    ),
    #05050a;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  color: #ffffff;

  overflow-x: hidden;

  padding:
    30px 16px 30px 16px;
}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.page {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
}


/* =========================================================
   CARD

   IMPORTANT:
   No transform animation here.
   This helps Meta Event Setup Tool calculate
   the real position of elements correctly.
   ========================================================= */

.card {

  width: 100%;

  background: rgba(255,255,255,0.045);

  border: 1px solid rgba(255,255,255,0.10);

  border-radius: 24px;

  padding: 38px 24px 32px;

  text-align: center;

  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  box-shadow:
    0 10px 45px rgba(0,0,0,0.55);

}


/* =========================================================
   PROFILE IMAGE
   ========================================================= */

.avatar-wrap {

  width: 100px;
  height: 100px;

  margin:
    0 auto 20px;

}

.avatar {

  width: 100px;
  height: 100px;

  display: block;

  border-radius: 50%;

  object-fit: cover;

  border:
    2px solid rgba(140,120,255,0.85);

  box-shadow:
    0 0 18px rgba(140,120,255,0.55),
    0 0 35px rgba(0,153,255,0.30);

}


/* =========================================================
   BRAND
   ========================================================= */

.brand-name {

  font-size: 27px;

  line-height: 1.2;

  font-weight: 800;

  letter-spacing: 0.5px;

  background:
    linear-gradient(
      90deg,
      #8c78ff,
      #6a9bff
    );

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;

  margin-bottom: 9px;

}


/* =========================================================
   BADGE
   ========================================================= */

.badge {

  display: inline-flex;

  align-items: center;
  justify-content: center;

  gap: 6px;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: 0.5px;

  color: #9ba8ff;

  background:
    rgba(140,120,255,0.12);

  border:
    1px solid rgba(140,120,255,0.35);

  padding:
    6px 12px;

  border-radius: 999px;

  margin-bottom: 18px;

}


/* =========================================================
   DESCRIPTION
   ========================================================= */

.desc {

  font-size: 14px;

  line-height: 1.65;

  color: #b8b8c8;

  padding: 0 4px;

}


/* =========================================================
   CTA BUTTON

   IMPORTANT:
   No transform animation.
   This makes Meta Event Setup Tool
   detect the button more reliably.
   ========================================================= */

.cta-btn {

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  width: 100%;

  margin-top: 25px;

  padding: 16px 20px;

  min-height: 54px;

  font-size: 16px;

  font-weight: 700;

  line-height: 1;

  color: #ffffff;

  text-decoration: none;

  border: none;

  border-radius: 14px;

  cursor: pointer;

  background:
    linear-gradient(
      90deg,
      #6a4cff,
      #3d8bff
    );

  box-shadow:
    0 0 22px rgba(106,76,255,0.50);

  transition:
    box-shadow 0.2s ease,
    opacity 0.2s ease;

}


/* Hover */

.cta-btn:hover {

  box-shadow:
    0 0 32px rgba(106,76,255,0.75);

}


/* Click */

.cta-btn:active {

  opacity: 0.85;

}


/* Telegram icon */

.cta-btn svg {

  width: 20px;

  height: 20px;

  flex-shrink: 0;

}


/* =========================================================
   STATUS
   ========================================================= */

.spinner-wrap {

  margin-top: 18px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 8px;

}

.spinner {

  width: 18px;

  height: 18px;

  border-radius: 50%;

  border:
    2px solid rgba(140,120,255,0.25);

  border-top-color:
    #8c78ff;

  animation:
    spin 0.8s linear infinite;

}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}

.spinner-text {

  font-size: 12px;

  color: #7a7a8c;

}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

  margin-top: 22px;

  font-size: 11px;

  color: #55556a;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 380px) {

  body {
    padding: 20px 12px;
  }

  .card {
    padding:
      32px 18px 28px;
  }

  .brand-name {
    font-size: 25px;
  }

  .desc {
    font-size: 13px;
  }

  .cta-btn {
    font-size: 15px;
  }

}

</style>

</head>


<body>

<div class="page">

  <main class="card">

    <!-- =====================================================
         PROFILE
         ===================================================== -->

    <div class="avatar-wrap">

      <img
        class="avatar"
        id="profileImg"
        src="https://i.ibb.co/YBMJZvtc/Whats-App-Image-2026-08-28-at-12-04-06-AM.jpg"
        alt="ADITI Official Community"
      >

    </div>


    <!-- =====================================================
         NAME
         ===================================================== -->

    <h1 class="brand-name">
      ADITI
    </h1>


    <!-- =====================================================
         VERIFIED BADGE
         ===================================================== -->

    <div class="badge">
      ✓ OFFICIAL COMMUNITY
    </div>


    <!-- =====================================================
         DESCRIPTION
         ===================================================== -->

    <p class="desc">
      Join the ADITI community and stay connected with our
      latest updates and information.
    </p>


    <!-- =====================================================
         TELEGRAM CTA

         Meta Event Setup Tool can select this button.

         Clicking it fires:
         Lead

         Then opens Telegram.
         ===================================================== -->

    <a
      href="https://t.me/+UeHP8AKvAKkzNDJl"
      target="_blank"
      rel="noopener noreferrer"
      class="cta-btn"
      id="joinBtn"
      aria-label="Join ADITI Telegram Community"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >

        <path
          d="M21.2 3.6
             2.9 10.7
             C1.7 11.2 1.7 11.9 2.7 12.2
             L7.4 13.7
             L9.2 19.3
             C9.4 19.9 9.6 20.1 10 20.1
             C10.4 20.1 10.6 19.9 10.9 19.6
             L13 17.6
             L17.4 20.8
             C18.2 21.3 18.8 21 19 20.1
             L22 6.1
             C22.3 4.9 21.6 3.4 21.2 3.6Z"
          fill="white"
        />

      </svg>

      JOIN TELEGRAM

    </a>


    <!-- =====================================================
         STATUS
         ===================================================== -->

    <div class="spinner-wrap">

      <div class="spinner"></div>

      <span class="spinner-text">
        Redirecting you now…
      </span>

    </div>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <div class="footer">
      © 2026 ADITI 0.2
    </div>

  </main>

</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

/*
=============================================================
  CONFIGURATION
=============================================================
*/

const TELEGRAM_LINK =
  "https://t.me/+UeHP8AKvAKkzNDJl";


/*
=============================================================
  SET TELEGRAM LINK
=============================================================
*/

const joinButton =
  document.getElementById("joinBtn");

joinButton.href =
  TELEGRAM_LINK;


/*
=============================================================
  META PIXEL CTA TRACKING
=============================================================

  When the user clicks JOIN TELEGRAM:

  1. Meta Pixel sends a Lead event.
  2. Telegram opens in a new tab.

  IMPORTANT:
  We do NOT fire the event automatically after
  20 seconds anymore.

=============================================================
*/

joinButton.addEventListener("click", function () {

  if (typeof fbq === "function") {

    fbq(
      "track",
      "Lead"
    );

  }

});


/*
=============================================================
  PREVENT DOUBLE CLICK
=============================================================
*/

let clicked = false;

joinButton.addEventListener("click", function () {

  if (clicked) {
    return;
  }

  clicked = true;

  setTimeout(function () {
    clicked = false;
  }, 1500);

});


/*
=============================================================
  PROFILE IMAGE ERROR HANDLING
=============================================================
*/

const profileImg =
  document.getElementById("profileImg");

profileImg.addEventListener(
  "error",
  function () {

    this.style.display = "none";

  }
);

</script>

</body>
</html>
